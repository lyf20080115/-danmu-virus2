<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="弹幕病毒 - 心形、爆散、满屏弹幕与最终文字动画">
<title>弹幕病毒</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
#app{position:fixed;inset:0;background:#fff;overflow:hidden}
.d{position:absolute;white-space:nowrap;pointer-events:none;user-select:none;font-weight:900;line-height:1;text-shadow:1px 1px 2px #0002;transform:translate(-50%,-50%) scale(0);opacity:0;transition:left 1.1s cubic-bezier(.2,.8,.2,1),top 1.1s cubic-bezier(.2,.8,.2,1),transform 1.1s cubic-bezier(.2,.8,.2,1),opacity .4s ease}
#final{position:absolute;left:50%;top:48%;white-space:nowrap;opacity:0;transform:translate(-50%,-50%) scale(.01);font-weight:1000;font-size:clamp(42px,14vw,88px);text-align:center;text-shadow:3px 3px 0 #00000010;transition:transform 2.2s cubic-bezier(.16,1,.3,1),opacity .35s ease}
#panel{position:fixed;z-index:10;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(94vw,520px);padding:10px;display:flex;gap:8px;background:#fffffff2;border:1px solid #ddd;border-radius:17px;box-shadow:0 8px 30px #00000018;backdrop-filter:blur(12px)}
input{flex:1;min-width:0;height:46px;border:1px solid #d5d5d5;border-radius:11px;padding:0 13px;font-size:16px;outline:0;background:#fff}
button{height:46px;border:0;border-radius:11px;padding:0 17px;background:#111;color:#fff;font-size:16px;font-weight:800;touch-action:manipulation}
button:active{transform:scale(.95)}
@media (prefers-reduced-motion:reduce){.d,#final{transition:none!important}}
</style>
</head>
<body>
<main id="app"><div id="final"></div></main>
<section id="panel" aria-label="弹幕设置">
<input id="text" maxlength="30" value="弹幕病毒" placeholder="输入弹幕文字" aria-label="弹幕文字">
<button id="play" type="button">重播</button>
</section>
<script>
const app=document.querySelector("#app"),finalEl=document.querySelector("#final"),input=document.querySelector("#text"),playBtn=document.querySelector("#play");
const colors=["#ff1744","#ff4081","#e91e63","#9c27b0","#673ab7","#3f51b5","#2196f3","#00bcd4","#009688","#4caf50","#8bc34a","#ffc107","#ff9800","#ff5722"];
let nodes=[],timers=[],running=false;
const color=()=>colors[Math.floor(Math.random()*colors.length)];
function clearAll(){timers.forEach(clearTimeout);timers=[];nodes.forEach(n=>n.remove());nodes=[];finalEl.style.opacity=0;finalEl.style.transform="translate(-50%,-50%) scale(.01)"}
function add(x,y,size){const n=document.createElement("span");n.className="d";n.textContent=input.value.trim()||"弹幕病毒";n.style.left=x+"px";n.style.top=y+"px";n.style.fontSize=size+"px";n.style.color=color();app.appendChild(n);nodes.push(n);return n}
function heart(t,k){return{x:16*Math.sin(t)**3*k,y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*k}}
function play(){
 clearAll();running=true;
 const W=innerWidth,H=innerHeight,cx=W/2,cy=H/2-70,k=Math.min(W,H)/40;
 for(let i=0;i<115;i++){const p=heart(i/115*Math.PI*2,k),n=add(cx+p.x+(Math.random()-.5)*18,cy+p.y+(Math.random()-.5)*18,13+Math.random()*13);n.style.transform="translate(-50%,-50%) scale(0)";timers.push(setTimeout(()=>{if(!running)return;n.style.opacity=1;n.style.transform="translate(-50%,-50%) scale(1)"},Math.random()*800))}
 timers.push(setTimeout(()=>{nodes.forEach((n,i)=>{const a=Math.random()*Math.PI*2,d=Math.max(W,H)*(.55+Math.random()*.9);timers.push(setTimeout(()=>{n.style.left=W/2+Math.cos(a)*d+"px";n.style.top=H/2+Math.sin(a)*d+"px";n.style.transform=`translate(-50%,-50%) rotate(${(Math.random()-.5)*30}deg) scale(${.7+Math.random()*.7})`},i*7))})},1900));
 timers.push(setTimeout(()=>{for(let i=0;i<170;i++){const n=add(Math.random()*W,Math.random()*H,13+Math.random()*25);n.style.opacity=0;n.style.transform="translate(-50%,-50%) scale(.1)";timers.push(setTimeout(()=>{if(!running)return;n.style.opacity=1;n.style.transform=`translate(-50%,-50%) rotate(${(Math.random()-.5)*24}deg) scale(${.7+Math.random()})`},i*7))}},3500));
 timers.push(setTimeout(()=>{nodes.forEach(n=>{n.style.opacity=0;n.style.transform="translate(-50%,-50%) scale(0)"});},6500));
 timers.push(setTimeout(()=>{nodes.forEach(n=>n.remove());nodes=[];finalEl.textContent=input.value.trim()||"弹幕病毒";finalEl.style.color=color();finalEl.style.opacity=1;void finalEl.offsetWidth;finalEl.style.transform="translate(-50%,-50%) scale(1.5)"},7600));
}
playBtn.addEventListener("click",play);
input.addEventListener("keydown",e=>{if(e.key==="Enter")play()});
window.addEventListener("resize",()=>{if(!running)play()});
setTimeout(play,350);
</script>
</body>
</html>
